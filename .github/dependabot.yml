version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:30"
      timezone: Australia/Sydney
    open-pull-requests-limit: 5
    groups:
      development-tooling:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:45"
      timezone: Australia/Sydney
    open-pull-requests-limit: 5
